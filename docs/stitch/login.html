<style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
        .font-sourceSerif4 { font-family: 'Source Serif 4', serif; }
        .font-hankenGrotesk { font-family: 'Hanken Grotesk', sans-serif; }
        
        /* Focus styles for inputs */

            border-bottom-color: #144622 !important; /* primary-container (BCG Green) */
            outline: none;
            box-shadow: none !important;

<body class="bg-off-white text-on-surface min-h-screen flex flex-col antialiased">
<!-- Header / TopNavBar (Suppressed for Login per rules, but requested by user. We will show a simplified, non-navigational header for the login flow to maintain brand authority without distractions) -->
<header class="fixed top-0 w-full z-50 bg-off-white/90 backdrop-blur-md border-b border-outline-variant flat no shadows">
<div class="flex justify-center md:justify-between items-center w-full px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto h-20">
<div class="font-sourceSerif4 text-headline-md font-bold text-primary">THE ICG</div>
<!-- Navigation links suppressed for linear/transactional login page -->
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center pt-20 pb-20 relative">
<!-- Background Architectural Image/Texture -->
<div class="absolute inset-0 z-0 opacity-10" data-alt="A highly textured, out-of-focus background image showing the abstract geometric patterns of a modern glass and steel skyscraper facade. The lighting is bright and high-key, creating a pristine, light-mode corporate aesthetic in pure whites and soft grays. The mood is authoritative and structured, perfectly suited for a high-end management consulting firm's portal login." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDIZcYEAO3u_g9Yh_an3moQfv06U3Wupyc5zdKN_pBnrkkha1r540DjBz7t06bBCeOcaSHJfuyrbIQA7iepHsgQ4VZQgWVdFDXikeNHKVUd9urBFSBvuVqrgr9uyloLvH3VL7xhi8tG7eRpQLkweLgIYGy9Mn57Fo0KSoACUwu8OGypLEt9N44LCdmiQDGspVfmZj6H4NIUowvbZgKrWVfVs5lLibaN0Lfajb71raCy9ne2sjzp56Ia')"></div>
<!-- Login Container -->
<div class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<div class="bg-pure-white border border-outline-variant p-8 md:p-12 flat no shadows transition-all duration-300 hover:border-outline">
<div class="mb-10 text-center">
<h1 class="font-sourceSerif4 text-headline-lg-mobile md:text-headline-md text-primary mb-2">Consultant Portal</h1>
<p class="font-hankenGrotesk text-body-md text-on-surface-variant">Sign in to access strategic resources.</p>
</div>
<form action="#" class="space-y-8" method="POST">
<!-- Email Input -->
<div class="relative group">
<label class="font-hankenGrotesk text-label-md uppercase tracking-widest text-on-surface-variant mb-2 block transition-colors group-focus-within:text-primary-container" for="email">Corporate Email</label>
<input class="w-full bg-transparent border-0 border-b-2 border-outline-variant px-0 py-2 font-hankenGrotesk text-body-lg text-on-surface transition-colors focus:ring-0 focus:border-primary-container placeholder-outline-variant/50" id="email" name="email" placeholder="j.doe@theicg.com" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="relative group">
<div class="flex justify-between items-center mb-2">
<label class="font-hankenGrotesk text-label-md uppercase tracking-widest text-on-surface-variant transition-colors group-focus-within:text-primary-container" for="password">Password</label>
<a class="font-hankenGrotesk text-label-md text-on-surface-variant hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<input class="w-full bg-transparent border-0 border-b-2 border-outline-variant px-0 py-2 font-hankenGrotesk text-body-lg text-on-surface transition-colors focus:ring-0 focus:border-primary-container" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 rounded-none border-outline-variant text-primary-container focus:ring-primary-container" id="remember_me" name="remember_me" type="checkbox"/>
<label class="ml-3 block font-hankenGrotesk text-body-md text-on-surface-variant" for="remember_me">
                            Keep me signed in
                        </label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-pure-white font-hankenGrotesk text-label-md uppercase tracking-widest py-4 px-6 rounded-none relative overflow-hidden group transition-transform duration-200 hover:scale-[1.02]" type="submit">
<span class="relative z-10">Sign In</span>
<!-- Bottom accent on hover -->
<div class="absolute bottom-0 left-0 w-full h-1 bg-secondary-fixed transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300"></div>
</button>
</form>
<div class="mt-8 text-center">
<p class="font-hankenGrotesk text-label-md text-on-surface-variant">
                        Secure Access for Authorized Personnel Only.
                    </p>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-margin-desktop bg-primary border-t border-primary-container flat no shadows mt-auto relative z-10">
<div class="grid grid-cols-1 md:grid-cols-12 gap-gutter px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto items-center">
<div class="md:col-span-4 mb-8 md:mb-0">
<div class="font-sourceSerif4 text-headline-md text-off-white mb-2">THE ICG</div>
<p class="font-hankenGrotesk text-body-md text-off-white/70">
                    © 2024 THE ICG. All rights reserved. Visionary Infrastructure. Global Strategy.
                </p>
</div>

<a class="font-hankenGrotesk text-body-md text-off-white/70 hover:text-off-white transition-colors" href="#">Privacy Policy</a>
<a class="font-hankenGrotesk text-body-md text-off-white/70 hover:text-off-white transition-colors" href="#">Terms of Service</a>
<a class="font-hankenGrotesk text-body-md text-off-white/70 hover:text-off-white transition-colors" href="#">Compliance</a>
<a class="font-hankenGrotesk text-body-md text-off-white/70 hover:text-off-white transition-colors" href="#">Global Offices</a>
</div>
</div>
</footer>
